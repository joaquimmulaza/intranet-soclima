<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Arquivos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        .scroll-container {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            cursor: grab;
            background-color: #E1E1E1;
            padding: 10px;
            gap: 10px;
        }

        .outroContainer{
            width: 800px;
            margin: 0 auto;
            overflow-x: auto;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .mainContainer::-webkit-scrollbar {
            display: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            border: 0.75px solid #555;
            padding: 8px 12px;
            border-radius: 5px;
            background-color: #F0F0F0;
            width: max-content;
        }

        .mainContainer{
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            min-width: max-content;
        }

        .font-semibold{
            color: #555;
            font-size: 10px;
            font-weight: 700 !important;
        }

        .textAbrirContainerPDF{
            color: #555;
            font-size: 10px;
            font-weight: 400;
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="outroContainer">
        <div class="mainContainer">
            <div class="flex gap-4 mb-4">
                <label class="cursor-pointer border p-3 rounded-lg shadow bg-white hover:bg-gray-100">
                    <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
                    <span class="flex items-center space-x-2 text-red-600">
                        📄 <span>Upload PDF</span>
                    </span>
                </label>
            </div>
            <div id="fileContainer" class="scroll-container flex">
                <!-- Os arquivos aparecerão aqui -->
            </div>
        </div>
    </div>

    <script>
        let maxWidth = 0;

const fileContainer = document.getElementById("fileContainer");

// Função para atualizar a largura de todos os arquivos com base no maior nome
function updateMaxWidth() {
    const allFiles = document.querySelectorAll(".file-item");
    maxWidth = 0; // Resetar para recalcular
    allFiles.forEach(fileItem => {
        const tempSpan = document.createElement("span");
        tempSpan.style.visibility = "hidden";
        tempSpan.style.whiteSpace = "nowrap";
        tempSpan.textContent = fileItem.querySelector(".font-semibold").textContent;
        document.body.appendChild(tempSpan);
        const fileWidth = tempSpan.offsetWidth + 80; // Adiciona o padding adicional
        document.body.removeChild(tempSpan);
        if (fileWidth > maxWidth) maxWidth = fileWidth;
    });
    allFiles.forEach(el => el.style.width = maxWidth + "px"); // Aplica a largura máxima a todos
}

fileContainer.addEventListener("mousedown", (e) => {
    let isDown = true;
    let startX = e.pageX - fileContainer.offsetLeft;
    let scrollLeft = fileContainer.scrollLeft;
    fileContainer.classList.add("active");
    fileContainer.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - fileContainer.offsetLeft;
        const walk = (x - startX) * 2;
        fileContainer.scrollLeft = scrollLeft - walk;
    });
    fileContainer.addEventListener("mouseup", () => {
        isDown = false;
        fileContainer.classList.remove("active");
    });
    fileContainer.addEventListener("mouseleave", () => {
        isDown = false;
        fileContainer.classList.remove("active");
    });
});

document.getElementById("pdfInput").addEventListener("change", function (event) {
    handleFileUpload(event);
});

    if (!file) return;

                </svg>
            </span>
            <div class="flex-1">
                <p class="font-semibold truncate">${file.name}</p>
                <p class="textAbrirContainerPDF">Toque para abrir o ficheiro</p>
            </div>
            <button onclick="removeFile(this)">
                <svg width="25" height="24" viewBox="0 0 25 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.6035 6.41L18.1935 5L12.6035 10.59L7.01352 5L5.60352 6.41L11.1935 12L5.60352 17.59L7.01352 19L12.6035 13.41L18.1935 19L19.6035 17.59L14.0135 12L19.6035 6.41Z" fill="#555555"/>
                </svg>
            </button>
        </div>
    `;
    fileContainer.appendChild(fileItem);
    updateMaxWidth(); // Atualiza a largura de todos os itens
}

function removeFile(button) {
    button.parentElement.parentElement.remove();
    updateMaxWidth(); // Atualiza a largura após remover
}
    </script>
</body>
</html>
